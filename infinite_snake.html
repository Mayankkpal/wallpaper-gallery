<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Snake - Endless Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e, #2a2a5e);
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }
        
        .game-container {
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
            border: 2px solid #12c2c2;
        }
        
        canvas {
            border: 3px solid #00ffff;
            border-radius: 10px;
            background: #000;
            box-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        
        .ui {
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        
        .score {
            color: #00ff00;
            font-size: 24px;
            margin: 10px 0;
        }
        
        .mode-selector {
            margin: 10px 0;
        }
        
        .speed-control {
            margin: 10px 0;
        }
        
        .wallpaper-selector {
            margin: 10px 0;
        }
        
        select, button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #00ffff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }
        
        .speed-control button {
            padding: 12px 18px;
            font-size: 18px;
        }
        
        select:hover, button:hover {
            background: #00ccff;
            box-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        
        .instructions {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ff4444;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,68,68,0.5);
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 INFINITE SNAKE 🐍</h1>
        <div class="mode-selector">
            <label>Game Mode: </label>
            <select id="gameMode">
                <option value="classic">Classic</option>
                <option value="chaos">Chaos Mode</option>
                <option value="speedrun">Speed Run</option>
                <option value="survival">Survival</option>
                <option value="endwar">ENDWAR (Ultimate)</option>
            </select>
            <button onclick="startGame()">START GAME</button>
            <button onclick="resetGame()">RESET</button>
        </div>
        
        <div class="speed-control">
            <label>Speed: </label>
            <button onclick="increaseSpeed()">+</button>
            <span id="currentSpeed">150</span>
            <button onclick="decreaseSpeed()">-</button>
        </div>
        
        <div class="wallpaper-selector">
            <label>Wallpaper: </label>
            <select id="wallpaper">
                <option value="space">Space</option>
                <option value="forest">Forest</option>
                <option value="ocean">Ocean</option>
                <option value="fire">Fire</option>
            </select>
        </div>
        
        <div class="ui">
            <div class="score" id="score">Score: 0</div>
            <div id="level">Level: 1</div>
            <div id="modeInfo">Select a mode to begin!</div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div class="instructions">
            Use ARROW KEYS or WASD to move | ESC to pause
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>GAME OVER!</h2>
            <div id="finalScore" class="score">Score: 0</div>
            <button onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const modeInfoElement = document.getElementById('modeInfo');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        // Game state
        let gameState = {
            snake: [{x: 10, y: 10}],
            food: {},
            dx: 0,
            dy: 0,
            score: 0,
            level: 1,
            gridSize: 20,
            tileCount: 30,
            gameSpeed: 150,
            gameRunning: false,
            gamePaused: false,
            mode: 'classic',
            powerUps: [],
            obstacles: [],
            highScore: localStorage.getItem('snakeHighScore') || 0
        };

        // Mode configurations
        const gameModes = {
            classic: {
                name: "Classic",
                speed: 150,
                obstacles: false,
                powerUps: false,
                chaosFood: false,
                speedIncrease: 0.95
            },
            chaos: {
                name: "Chaos Mode",
                speed: 120,
                obstacles: true,
                powerUps: true,
                chaosFood: true,
                speedIncrease: 0.92
            },
            speedrun: {
                name: "Speed Run",
                speed: 100,
                obstacles: false,
                powerUps: false,
                chaosFood: false,
                speedIncrease: 0.90
            },
            survival: {
                name: "Survival",
                speed: 130,
                obstacles: true,
                powerUps: true,
                chaosFood: false,
                speedIncrease: 0.93
            },
            endwar: {
                name: "ENDWAR (Ultimate)",
                speed: 80,
                obstacles: true,
                powerUps: true,
                chaosFood: true,
                speedIncrease: 0.88,
                enemySnakes: true
            }
        };

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === 'Escape') {
                togglePause();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Game functions
        function startGame() {
            gameState.mode = document.getElementById('gameMode').value;
            gameState.gameRunning = true;
            gameState.gamePaused = false;
            gameOverElement.style.display = 'none';
            
            // Reset game state
            gameState.snake = [{x: 10, y: 10}];
            gameState.dx = 0;
            gameState.dy = 0;
            gameState.score = 0;
            gameState.level = 1;
            gameState.gameSpeed = gameModes[gameState.mode].speed;
            gameState.powerUps = [];
            gameState.obstacles = [];
            
            setInitialDirection();
            generateFood();
            updateUI();
            gameLoop();
        }

        function setInitialDirection() {
            gameState.dx = 1;
            gameState.dy = 0;
        }

        function resetGame() {
            gameState.gameRunning = false;
            gameState.gamePaused = false;
            gameState.snake = [{x: 10, y: 10}];
            gameState.dx = 0;
            gameState.dy = 0;
            gameState.score = 0;
            gameState.level = 1;
            gameState.gameSpeed = gameModes[gameState.mode].speed;
            gameState.powerUps = [];
            gameState.obstacles = [];
            updateUI();
        }

        function increaseSpeed() {
            gameState.gameSpeed = Math.max(50, gameState.gameSpeed - 10);
            updateSpeedDisplay();
        }

        function decreaseSpeed() {
            gameState.gameSpeed = Math.min(300, gameState.gameSpeed + 10);
            updateSpeedDisplay();
        }

        function updateSpeedDisplay() {
            document.getElementById('currentSpeed').textContent = gameState.gameSpeed;
        }

        function changeWallpaper() {
            const wallpaper = document.getElementById('wallpaper').value;
            const gradients = {
                space: 'linear-gradient(135deg, #0f0f23, #1a1a3e, #2a2a5e)',
                forest: 'linear-gradient(135deg, #228B22, #32CD32, #006400)',
                ocean: 'linear-gradient(135deg, #000080, #0000FF, #87CEEB)',
                fire: 'linear-gradient(135deg, #FF4500, #FF6347, #FFD700)'
            };
            document.body.style.background = gradients[wallpaper];
        }

        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function togglePause() {
            if (gameState.gameRunning) {
                gameState.gamePaused = !gameState.gamePaused;
                modeInfoElement.textContent = gameState.gamePaused ? 'PAUSED' : gameModes[gameState.mode].name;
            }
        }

        function generateFood() {
            if (gameModes[gameState.mode].chaosFood) {
                // Chaos mode: multiple colored foods with different values
                gameState.food = {
                    x: Math.floor(Math.random() * gameState.tileCount),
                    y: Math.floor(Math.random() * gameState.tileCount),
                    value: Math.floor(Math.random() * 5) + 1,
                    color: `hsl(${Math.random() * 360}, 70%, 60%)`
                };
            } else {
                gameState.food = {
                    x: Math.floor(Math.random() * gameState.tileCount),
                    y: Math.floor(Math.random() * gameState.tileCount),
                    value: 1,
                    color: '#ff4444'
                };
            }
        }

        function generatePowerUp() {
            if (gameModes[gameState.mode].powerUps && Math.random() < 0.3) {
                gameState.powerUps.push({
                    x: Math.floor(Math.random() * gameState.tileCount),
                    y: Math.floor(Math.random() * gameState.tileCount),
                    type: ['speed', 'score', 'shrink'][Math.floor(Math.random() * 3)],
                    timer: 300
                });
            }
        }

        function generateObstacles() {
            if (gameModes[gameState.mode].obstacles && Math.random() < 0.1) {
                gameState.obstacles.push({
                    x: Math.floor(Math.random() * gameState.tileCount),
                    y: Math.floor(Math.random() * gameState.tileCount)
                });
            }
        }

        function updateDirection() {
            // Prevent reverse direction
            if (keys['arrowleft'] || keys['a']) {
                if (gameState.dx !== 1) {
                    gameState.dx = -1;
                    gameState.dy = 0;
                }
            } else if (keys['arrowright'] || keys['d']) {
                if (gameState.dx !== -1) {
                    gameState.dx = 1;
                    gameState.dy = 0;
                }
            } else if (keys['arrowup'] || keys['w']) {
                if (gameState.dy !== 1) {
                    gameState.dx = 0;
                    gameState.dy = -1;
                }
            } else if (keys['arrowdown'] || keys['s']) {
                if (gameState.dy !== -1) {
                    gameState.dx = 0;
                    gameState.dy = 1;
                }
            }
        }

        function moveSnake() {
            const head = {x: gameState.snake[0].x + gameState.dx, y: gameState.snake[0].y + gameState.dy};
            
            // Wrap around screen (infinite feel)
            if (head.x < 0) head.x = gameState.tileCount - 1;
            if (head.x >= gameState.tileCount) head.x = 0;
            if (head.y < 0) head.y = gameState.tileCount - 1;
            if (head.y >= gameState.tileCount) head.y = 0;
            
            gameState.snake.unshift(head);
        }

        function checkCollisions() {
            const head = gameState.snake[0];
            
            // Food collision
            if (head.x === gameState.food.x && head.y === gameState.food.y) {
                gameState.score += gameState.food.value * 10;
                generateFood();
                generatePowerUp();
                generateObstacles();
            } else {
                gameState.snake.pop();
            }
            
            // Power-up collision
            for (let i = gameState.powerUps.length - 1; i >= 0; i--) {
                const powerUp = gameState.powerUps[i];
                if (head.x === powerUp.x && head.y === powerUp.y) {
                    applyPowerUp(powerUp);
                    gameState.powerUps.splice(i, 1);
                }
            }
            
            // Obstacle collision (game over)
            for (let obstacle of gameState.obstacles) {
                if (head.x === obstacle.x && head.y === obstacle.y) {
                    gameOver();
                    return;
                }
            }
            
            // Self collision
            for (let segment of gameState.snake.slice(1)) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
        }

        function applyPowerUp(powerUp) {
            switch(powerUp.type) {
                case 'speed':
                    gameState.gameSpeed *= 0.9;
                    break;
                case 'score':
                    gameState.score += 50;
                    break;
                case 'shrink':
                    if (gameState.snake.length > 3) {
                        gameState.snake.splice(-3, 3);
                    }
                    break;
            }
        }

        function updateLevel() {
            const newLevel = Math.floor(gameState.score / 100) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                gameState.gameSpeed *= gameModes[gameState.mode].speedIncrease;
            }
        }

        function gameOver() {
            gameState.gameRunning = false;
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('snakeHighScore', gameState.score);
            }
            finalScoreElement.textContent = `Final Score: ${gameState.score} | High Score: ${gameState.highScore}`;
            gameOverElement.style.display = 'block';
        }

        function updateUI() {
            scoreElement.textContent = `Score: ${gameState.score}`;
            levelElement.textContent = `Level: ${gameState.level}`;
            modeInfoElement.textContent = gameState.gamePaused ? 'PAUSED' : 
                                       gameState.gameRunning ? gameModes[gameState.mode].name : 'Select a mode to begin!';
            updateSpeedDisplay();
        }

        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw snake
            gameState.snake.forEach((segment, index) => {
                const size = gameState.gridSize - 4;
                const offset = (gameState.gridSize - size) / 2;
                ctx.fillStyle = index === 0 ? '#00ff00' : `hsl(${gameState.score % 360}, 100%, 50%)`;
                ctx.fillRect(segment.x * gameState.gridSize + offset, segment.y * gameState.gridSize + offset, 
                           size, size);
            });
            
            // Draw food
            const foodSize = gameState.gridSize - 4;
            const foodOffset = (gameState.gridSize - foodSize) / 2;
            ctx.fillStyle = gameState.food.color;
            ctx.fillRect(gameState.food.x * gameState.gridSize + foodOffset, gameState.food.y * gameState.gridSize + foodOffset, 
                       foodSize, foodSize);
            
            // Draw power-ups
            gameState.powerUps.forEach(powerUp => {
                const powerSize = gameState.gridSize - 4;
                const powerOffset = (gameState.gridSize - powerSize) / 2;
                ctx.fillStyle = powerUp.type === 'speed' ? '#ffff00' : 
                               powerUp.type === 'score' ? '#ff00ff' : '#00ffff';
                ctx.fillRect(powerUp.x * gameState.gridSize + powerOffset, powerUp.y * gameState.gridSize + powerOffset, 
                           powerSize, powerSize);
            });
            
            // Draw obstacles
            if (gameModes[gameState.mode].obstacles) {
                ctx.fillStyle = '#ff4444';
                gameState.obstacles.forEach(obstacle => {
                    if (gameState.mode === 'survival') {
                        ctx.fillRect(obstacle.x * gameState.gridSize - 5, obstacle.y * gameState.gridSize - 5, 
                                   gameState.gridSize + 10, gameState.gridSize + 10);
                    } else {
                        const obsSize = gameState.gridSize - 4;
                        const obsOffset = (gameState.gridSize - obsSize) / 2;
                        ctx.fillRect(obstacle.x * gameState.gridSize + obsOffset, obstacle.y * gameState.gridSize + obsOffset, 
                                   obsSize, obsSize);
                    }
                });
            }
            
            // Draw UI overlay
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(10, 10, 200, 60);
            ctx.fillStyle = '#00ffff';
            ctx.font = '20px Courier New';
            ctx.fillText(`Score: ${gameState.score}`, 20, 35);
            ctx.fillText(`Level: ${gameState.level}`, 20, 60);
        }

        function gameLoop() {
            if (!gameState.gameRunning || gameState.gamePaused) return;
            
            updateDirection();
            moveSnake();
            checkCollisions();
            updateLevel();
            updateUI();
            drawGame();
            
            setTimeout(gameLoop, gameState.gameSpeed);
        }

        // Initialize
        document.getElementById('wallpaper').addEventListener('change', changeWallpaper);
        updateUI();
    </script>
</body>
</html>
